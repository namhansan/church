backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "교회 기본 정보"
    files:
      - name: "settings"
        label: "기본 정보 수정"
        file: "content/site.json"
        fields:
          - { label: "교단명 (작은 글씨, 예: 기독교대한성결교회)", name: "org_name", widget: "string", required: false }
          - { label: "교회 이름 (큰 글씨)", name: "church_name", widget: "string" }
          - { label: "슬로건 (한 줄 소개)", name: "tagline", widget: "string" }
          - { label: "로고 이미지", name: "logo", widget: "image", required: false, hint: "정사각형 이미지를 권장합니다." }
          - { label: "교회 전경 사진", name: "church_photo", widget: "image", required: false, hint: "메인 화면 상단에 크게 표시됩니다." }
          - { label: "담임목사 이름", name: "pastor_name", widget: "string" }
          - { label: "인사말", name: "greeting", widget: "text" }
          - { label: "교회 연혁", name: "history", widget: "text" }
          - { label: "비전", name: "vision", widget: "string" }
          - { label: "주소", name: "address", widget: "string" }
          - { label: "교통 안내", name: "address_detail", widget: "string" }
          - { label: "전화번호", name: "phone", widget: "string" }
          - { label: "이메일", name: "email", widget: "string" }
          - { label: "지도 위도 (latitude)", name: "map_lat", widget: "string" }
          - { label: "지도 경도 (longitude)", name: "map_lng", widget: "string" }
          - { label: "헌금 은행", name: "offering_bank", widget: "string" }
          - { label: "헌금 계좌번호", name: "offering_account", widget: "string" }
          - { label: "예금주", name: "offering_holder", widget: "string" }
          - { label: "유튜브 채널 링크", name: "sns_youtube", widget: "string", required: false }
          - { label: "인스타그램 링크", name: "sns_instagram", widget: "string", required: false }
          - { label: "유튜브 채널 ID (실시간 예배용)", name: "youtube_channel_id", widget: "string", required: false, hint: "유튜브 채널 → 정보 → '채널 ID'에서 확인 (UC로 시작하는 문자열). 비워두면 실시간 예배 섹션에 준비중 메시지가 표시됩니다." }
          - { label: "100주년 배너 표시 여부", name: "anniversary_enabled", widget: "boolean", default: false }
          - { label: "100주년 표어 이미지", name: "anniversary_image", widget: "image", required: false }
          - { label: "100주년 배너 캡션 문구", name: "anniversary_caption", widget: "string", required: false }
          - label: "예배 시간표"
            name: "service_times"
            widget: "list"
            summary: "{{name}} — {{time}}"
            fields:
              - { label: "예배 이름", name: "name", widget: "string" }
              - { label: "시간", name: "time", widget: "string" }
              - { label: "장소", name: "place", widget: "string" }

  - name: "notices"
    label: "공지사항"
    files:
      - name: "notices"
        label: "공지사항 목록 수정"
        file: "content/notices.json"
        fields:
          - label: "공지사항"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "내용", name: "body", widget: "text" }

  - name: "sermons"
    label: "설교"
    files:
      - name: "sermons"
        label: "설교 목록 수정"
        file: "content/sermons.json"
        fields:
          - label: "설교"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "설교자", name: "preacher", widget: "string" }
              - { label: "본문 말씀", name: "scripture", widget: "string" }
              - { label: "유튜브 링크", name: "youtube_url", widget: "string" }

  - name: "departments"
    label: "부서 소개"
    files:
      - name: "departments"
        label: "부서 목록 수정"
        file: "content/departments.json"
        fields:
          - label: "부서"
            name: "departments"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "부서 이름", name: "name", widget: "string" }
              - { label: "소개", name: "summary", widget: "text" }
              - { label: "담당자", name: "leader", widget: "string" }

  - name: "popup"
    label: "팝업 공지"
    files:
      - name: "popup"
        label: "팝업 공지 수정"
        file: "content/popup.json"
        fields:
          - { label: "팝업 사용 여부 (끄면 화면에 안 뜹니다)", name: "enabled", widget: "boolean", default: false }
          - { label: "제목", name: "title", widget: "string" }
          - { label: "이미지 (선택)", name: "image", widget: "image", required: false }
          - { label: "내용", name: "content", widget: "text" }
          - { label: "버튼 링크 (선택, 누르면 이동할 주소)", name: "link", widget: "string", required: false }
          - { label: "버튼 문구", name: "link_text", widget: "string", required: false }
          - { label: "게시 시작일 (선택, 비워두면 즉시 시작)", name: "start_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, picker_utc: true }
          - { label: "게시 종료일 (선택, 비워두면 계속 표시)", name: "end_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, picker_utc: true }

  - name: "leaders"
    label: "섬기는 사람"
    files:
      - name: "leaders"
        label: "섬기는 사람 수정"
        file: "content/leaders.json"
        fields:
          - label: "담임목사"
            name: "pastor"
            widget: "object"
            fields:
              - { label: "이름", name: "name", widget: "string" }
              - { label: "사진", name: "photo", widget: "image", required: false }
              - { label: "소개글", name: "bio", widget: "text" }
          - { label: "교역자 소개 문구", name: "clergy_intro", widget: "text", required: false }
          - label: "교역자 (전임 목회자)"
            name: "clergy"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "이름", name: "name", widget: "string" }
              - { label: "직분/담당", name: "role", widget: "string" }
          - { label: "장로 소개 문구", name: "elders_intro", widget: "text", required: false }
          - label: "시무장로"
            name: "elders_acting"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "이름", name: "name", widget: "string" }
          - label: "원로장로"
            name: "elders_emeritus"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "이름", name: "name", widget: "string" }
          - label: "명예장로"
            name: "elders_honorary"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "이름", name: "name", widget: "string" }
          - { label: "성도 소개 문구", name: "congregation_note", widget: "text" }

  - name: "ministries"
    label: "사역 안내"
    files:
      - name: "ministries"
        label: "사역 목록 수정"
        file: "content/ministries.json"
        fields:
          - label: "사역"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "사역 이름", name: "name", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }

  - name: "events"
    label: "행사 사진"
    files:
      - name: "events"
        label: "행사 앨범 수정"
        file: "content/events.json"
        fields:
          - label: "앨범"
            name: "albums"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "행사 이름", name: "title", widget: "string" }
              - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "대표 사진 (목록에 표시)", name: "cover", widget: "image" }
              - label: "사진들"
                name: "photos"
                widget: "list"
                field: { label: "사진", name: "photo", widget: "image" }

  - name: "bulletins"
    label: "주보"
    files:
      - name: "bulletins"
        label: "주보 목록 수정"
        file: "content/bulletins.json"
        fields:
          - label: "주보"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "주보 파일 (PDF)", name: "file", widget: "file", required: false, hint: "PDF 파일을 올려주세요." }

  - name: "worship"
    label: "예배안내 (예배별 소식)"
    files:
      - name: "worship"
        label: "예배별 소식 수정"
        file: "content/worship.json"
        fields:
          - label: "예배 항목 (순서를 바꾸지 마세요 — 메뉴 연결이 순서를 기준으로 합니다)"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "예배 이름", name: "name", widget: "string" }
              - label: "소식 (수시로 추가)"
                name: "updates"
                widget: "list"
                summary: "{{fields.date}} — {{fields.title}}"
                fields:
                  - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
                  - { label: "제목", name: "title", widget: "string" }
                  - { label: "내용", name: "content", widget: "text", required: false }
                  - label: "사진 (여러 장 가능)"
                    name: "photos"
                    widget: "list"
                    required: false
                    field: { label: "사진", name: "photo", widget: "image" }
                  - { label: "찬양 악보 파일 (PDF/이미지, 찬양 항목용)", name: "sheet_music", widget: "file", required: false }
                  - { label: "음원/영상 링크 (유튜브 등, 찬양 항목용)", name: "audio_link", widget: "string", required: false }

  - name: "resources"
    label: "자료실"
    files:
      - name: "resources"
        label: "자료실 목록 수정"
        file: "content/resources.json"
        fields:
          - label: "자료"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명 (선택)", name: "description", widget: "text", required: false }
              - { label: "파일", name: "file", widget: "file", hint: "PDF, 한글, 워드, 엑셀 등 어떤 파일이든 올릴 수 있습니다." }

  - name: "partners"
    label: "후원 단체"
    files:
      - name: "partners"
        label: "후원 단체 목록 수정"
        file: "content/partners.json"
        fields:
          - label: "후원 단체"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "단체/교회 이름", name: "name", widget: "string" }
              - { label: "구분 (예: 국내, 해외)", name: "region", widget: "string", required: false }
              - { label: "대표 사진 (목록에 표시)", name: "cover", widget: "image", required: false }
              - { label: "소개", name: "description", widget: "text" }
              - { label: "외부 홈페이지 링크 (있는 경우만)", name: "link", widget: "string", required: false, hint: "이 단체의 자체 홈페이지 주소가 있을 때만 입력하세요. 없으면 비워두세요." }
              - label: "소식 (수시로 추가)"
                name: "updates"
                widget: "list"
                summary: "{{fields.date}} — {{fields.title}}"
                fields:
                  - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
                  - { label: "제목", name: "title", widget: "string" }
                  - { label: "내용", name: "content", widget: "text" }
                  - label: "사진 (여러 장 가능)"
                    name: "photos"
                    widget: "list"
                    required: false
                    field: { label: "사진", name: "photo", widget: "image" }
